<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <!-- 🔄 CAMBIO AQUÍ: Enlace local a Font Awesome -->
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <div class="container">
        <div class="todo-app">
            <h1>To-Do App</h1>
            <div class="stat-container">
                <div class="details">
                    <h3>Keep it Up!</h3>
                    <div id="progressbar">
                        <div id="progress"></div>
                    </div>
                </div>
                <div class="stats-number">
                    <p id="numbers">0 / 0</p>
                </div>
            </div>    
            <form class="input-area" id="task-form">
             <input type="text" id="task-input" placeholder="Add a new task . . .">
             <button type="submit" id="add-task-btn"><i class="fa-solid fa-plus"></i></button>
            </form>
            <div class="todos-container">
                <ul id="task-list">
                </ul>
                <img class="empty-image" src="./images/empty.svg" alt="empty" width="300" height="200" >
            </div>    
        </div>
    </div>
    <script src="confetti.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
